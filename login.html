<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login & Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    h2 {
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      background-color: #007BFF;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .toggle {
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      color: #007BFF;
    }
    .error {
      color: red;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="form-title">Login</h2>
    <div id="form">
      <div class="form-group">
        <input type="text" id="username" placeholder="Username">
        <div id="user-error" class="error"></div>
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Password">
        <div id="pass-error" class="error"></div>
      </div>
      <div class="form-group" id="confirm-group" style="display: none;">
        <input type="password" id="confirm-password" placeholder="Confirm Password">
        <div id="confirm-error" class="error"></div>
      </div>
      <button onclick="handleSubmit()">Submit</button>
      <div class="toggle" onclick="toggleForm()">Don't have an account? Sign up</div>
    </div>
  </div>

  <script>
    let isSignup = false;

    function toggleForm() {
      isSignup = !isSignup;
      document.getElementById('form-title').innerText = isSignup ? 'Sign Up' : 'Login';
      document.getElementById('confirm-group').style.display = isSignup ? 'block' : 'none';
      document.querySelector('.toggle').innerText = isSignup ? 'Already have an account? Login' : 'Don\'t have an account? Sign up';
      clearErrors();
    }

    function clearErrors() {
      document.getElementById('user-error').innerText = '';
      document.getElementById('pass-error').innerText = '';
      document.getElementById('confirm-error').innerText = '';
    }

    function handleSubmit() {
      clearErrors();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirm-password').value.trim();

      let valid = true;

      if (username.length < 4) {
        document.getElementById('user-error').innerText = 'Username must be at least 4 characters';
        valid = false;
      }

      if (password.length < 6) {
        document.getElementById('pass-error').innerText = 'Password must be at least 6 characters';
        valid = false;
      }

      if (isSignup && password !== confirmPassword) {
        document.getElementById('confirm-error').innerText = 'Passwords do not match';
        valid = false;
      }

      if (valid) {
        alert(isSignup ? 'Signed up successfully!' : 'Logged in successfully!');
      }
    }
  </script>
</body>
</html>
